services:
  laravel-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306

    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

    volumes:
      - ./:/var/www/html:z
      - vendor:/var/www/html/vendor
      - backend_storage:/var/www/html/storage

    depends_on:
      mysql:
        condition: service_healthy
      vite:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - laravel

  vite:
    image: node:22-bookworm-slim
    init: true
    working_dir: /var/www/html
    command: sh -c 'npm ci --no-audit --no-fund && exec npm run dev'

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./:/var/www/html:z
      - node_modules:/var/www/html/node_modules

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/@vite/client').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

    networks:
      - laravel

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Defina DB_DATABASE no .env}
      MYSQL_USER: ${DB_USERNAME:?Defina DB_USERNAME no .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no .env}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=tcp --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute='SELECT 1' --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  backend_storage:
  mysql_data:
  vendor:
  node_modules:
